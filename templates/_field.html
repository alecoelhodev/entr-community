<div class="field{% if field.errors %} field-invalid{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if field.help_text %}<span class="field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</span>{% endif %}
  {% for error in field.errors %}<span class="field-error" id="{{ field.auto_id }}_error">{{ error }}</span>{% endfor %}
</div>
