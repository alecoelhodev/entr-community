{% if form.errors %}
  <p class="status">Invalid location or radius.</p>
{% else %}
  <h2>Within {{ radius_km|floatformat:"-1" }} km</h2>
  <ol class="nearby-list">
    {% for place in places %}
      <li><strong>{{ place.name }}</strong> <span>{{ place.distance_m|floatformat:0 }} m</span></li>
    {% empty %}
      <li class="hint">Nothing here yet.</li>
    {% endfor %}
  </ol>
{% endif %}
