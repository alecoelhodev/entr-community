{% extends "base.html" %}
{% load static %}

{% block scripts %}<script src="{% static 'js/map.js' %}" defer></script>{% endblock %}

{% block content %}
<div class="map-layout"
     x-data="placesMap"
     data-tile-url="{{ tile_url }}"
     data-geojson-url="{% url 'places:geojson' %}"
     data-nearby-url="{% url 'places:nearby' %}">
  <div class="map" x-ref="map"></div>
  <aside class="sidebar">
    <label class="radius">
      Radius
      <select x-model="radiusKm">
        <option value="1">1 km</option>
        <option value="5" selected>5 km</option>
        <option value="20">20 km</option>
        <option value="50">50 km</option>
      </select>
    </label>
    <p class="status" x-show="error" x-text="error"></p>
    <div id="nearby">
      <p class="hint">Click the map to find places nearby.</p>
    </div>
  </aside>
</div>
{% endblock %}
