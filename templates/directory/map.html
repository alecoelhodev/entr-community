{% extends "base.html" %}
{% load i18n static %}
{% block scripts %}<script src="{% static 'js/map.js' %}" defer></script>{% endblock %}
{% block content %}
<div class="map-page"
     x-data="directoryMap"
     :class="pageClass"
     data-tile-url="{{ tile_url }}"
     data-geojson-url="{% url 'directory:geojson' %}"
     data-nearby-url="{% url 'directory:nearby' %}"
     data-panel-url="{% url 'directory:panel' '__slug__' %}"
     data-center-lat="{{ center_lat|stringformat:'s' }}"
     data-center-lng="{{ center_lng|stringformat:'s' }}"
     data-zoom="{{ zoom|stringformat:'s' }}">
  <aside class="map-sidebar">
    <form class="map-filters" role="search" @submit.prevent="reloadAll">
      <div class="field">
        <label for="map-q">{% translate "Product or service" %}</label>
        <span class="search-input">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="map-q" type="search" maxlength="100" autocomplete="off" x-model="q"
                 placeholder="{% translate 'Golfeados, t-shirt printing, guitar lessons…' %}">
        </span>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="map-category">{% translate "Category" %}</label>
          <select id="map-category" x-model="category">
            <option value="">{% translate "All categories" %}</option>
            {% for category in categories %}<option value="{{ category.slug }}">{{ category.name }}</option>{% endfor %}
          </select>
        </div>
        <div class="field">
          <label for="map-radius">{% translate "Nearby radius" %}</label>
          <select id="map-radius" x-model="radiusKm">
            <option value="1">1 km</option>
            <option value="5" selected>5 km</option>
            <option value="20">20 km</option>
            <option value="50">50 km</option>
          </select>
        </div>
      </div>
    </form>
    <p class="map-notice" x-show="notice" x-text="notice" role="status"></p>
    <div id="nearby" class="map-results" x-show="showResults" aria-live="polite">
      <p class="hint">{% translate "Click the map to find businesses nearby." %}</p>
    </div>
    <div id="detail" class="map-detail" x-ref="detail" x-show="detailOpen"></div>
  </aside>
  <div class="map-canvas" x-ref="map" role="application" aria-label="{% translate 'Map of businesses' %}"></div>
</div>
{% endblock %}
